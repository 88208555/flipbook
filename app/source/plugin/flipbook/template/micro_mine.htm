<div class="fb-page fb-member-page">
 <section data-fb-region="header" class="fb-member" data-fb-member-header data-login-url="{$fb[loginurl]}" data-guest="{if !$fb[logged]}1{else}0{/if}"><div data-fb-region="avatar" class="fb-avatar"><!--{if $fb[member][avatar]}--><img src="{$fb[member][avatar]}" alt="头像"><!--{else}--><!--{eval echo flipbook\front_icon::svg('visitor');}--><!--{/if}--></div><div data-fb-region="identity" class="fb-member-main"><span data-fb-region="name" class="fb-member-name">{$fb[member][name]}</span><span data-fb-region="note" class="fb-member-note">{if $fb[logged]}{$fb[member][group]}{else}{$fb[options][note]}{/if}</span></div></section>
 <!--{if $fb[options][showStats]}--><div data-fb-region="stats" class="fb-stat-row"><a data-fb-region="statItem" class="fb-stat" href="{$fb[links][favorites]}"><span data-fb-region="statValue" class="fb-stat-value">{$fb[counts][favorite]}</span><span data-fb-region="statLabel" class="fb-stat-label">收藏</span></a><span data-fb-region="statDivider" class="fb-stat-sep"></span><a data-fb-region="statItem" class="fb-stat" href="{$fb[links][history]}"><span data-fb-region="statValue" class="fb-stat-value">{$fb[counts][history]}</span><span data-fb-region="statLabel" class="fb-stat-label">足迹</span></a><span data-fb-region="statDivider" class="fb-stat-sep"></span><a data-fb-region="statItem" class="fb-stat" href="{$fb[links][history]}&amp;action=share"><span data-fb-region="statValue" class="fb-stat-value">{$fb[counts][share]}</span><span data-fb-region="statLabel" class="fb-stat-label">分享</span></a></div><!--{/if}-->
 <!--{if $fb[resume] && $fb[options][showResume]}--><section data-fb-region="resume" class="fb-resume"><a data-fb-region="resumeCard" class="fb-resume-card" href="{$fb[resume][progress][readurl]}"><img data-fb-region="resumeCover" class="fb-resume-cover" src="{$fb[resume][cover]}"><div data-fb-region="resumeMain" class="fb-resume-main"><span data-fb-region="resumeTitle" class="fb-resume-name">{$fb[resume][name]}</span><span data-fb-region="resumeNote" class="fb-resume-note">继续阅读</span><!--{if isset($fb[resume][progress][percent]) && $fb[resume][progress][total] > 0}--><progress data-fb-region="resumeProgress" class="fb-progress" max="100" value="{$fb[resume][progress][percent]}">{$fb[resume][progress][percent]}%</progress><!--{/if}--></div><span data-fb-region="resumeArrow">›</span></a></section><!--{/if}-->
 <nav data-fb-region="menu" class="fb-menu"><!--{loop $fb[rows] $row}--><a data-fb-region="menuItem" data-fb-member-menu="{$row[key]}" class="fb-menu-row" href="{$row[url]}"><!--{eval echo str_replace('<svg ', '<svg data-fb-region="menuIcon" ', flipbook\front_icon::svg($row['icon']));}--><span data-fb-region="menuText" class="fb-menu-label">{$row[label]}</span><span data-fb-region="menuArrow" class="fb-menu-arrow">›</span></a><!--{/loop}-->
 <!--{if $fb[logged] && $fb[options][showLogout]}--><button data-fb-region="menuItem logout" type="button" class="fb-menu-row fb-logout" data-fb-logout><span data-fb-region="menuText" class="fb-menu-label">退出登录</span></button><!--{/if}--></nav>
</div>
