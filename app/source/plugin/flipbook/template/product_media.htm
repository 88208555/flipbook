<!--{eval $fb_media_type = $fb_media_group === 'detail' ? 'product_details' : 'product_highlights'; $fb_media = array_filter((array)$fb_media, 'is_array'); $fb_media_has_images = array_filter(array_column($fb_media, 'hasimage'));}-->
<div class="fb-product-media" data-fb-region="container" data-fb-product-component="{$fb_media_type}">
<!--{if $fb_media_has_images}-->
 <!--{if (!empty($fb_media_options[showTitle]) && $fb_media_options[title] !== '') || (!empty($fb_media_options[showCode]) && $fb_media_code !== '')}-->
 <div class="fb-product-media-head" data-fb-region="heading">
  <!--{if !empty($fb_media_options[showTitle]) && $fb_media_options[title] !== ''}-->
  <h3 class="fb-info-heading" data-fb-region="title" data-fb-product-title style="font-size:{$fb_media_options[size]}px;color:{$fb_media_options[color]}"><!--{eval echo flipbook\front_helper::e($fb_media_options['title']);}--></h3>
  <!--{/if}-->
  <!--{if !empty($fb_media_options[showCode]) && $fb_media_code !== ''}-->
  <span class="fb-product-media-code" data-fb-region="code" data-fb-product-code><!--{eval echo flipbook\front_helper::e(html_entity_decode((string)$fb_media_code, ENT_QUOTES, 'UTF-8'));}--></span>
  <!--{/if}-->
 </div>
 <!--{/if}-->
 <div class="fb-product-media-list" data-fb-region="list">
 <!--{loop $fb_media $media}-->
 <!--{if !empty($media[hasimage]) && !empty($media[image])}-->
 <div class="fb-product-media-item" data-fb-region="item" data-fb-viewer="{$media[image]}" data-fb-viewer-title="{$media[title]}" data-fb-viewer-group="{$fb_media_type}">
  <img class="fb-product-media-image" data-fb-region="image" src="{$media[image]}" alt="{$media[title]}">
  <!--{eval $fb_media_caption = isset($media['text']) && (string)$media['text'] !== '' ? $media['text'] : ($media['title'] ?? '');}-->
  <!--{if !empty($fb_media_options[showText]) && $fb_media_caption !== ''}-->
  <span class="fb-product-media-text" data-fb-region="text" data-fb-product-text>{$fb_media_caption}</span>
  <!--{/if}-->
 </div>
 <!--{/if}-->
 <!--{/loop}-->
 </div>
<!--{else}-->
 <div class="fb-empty" data-fb-product-empty><p class="fb-empty-text">{if $fb_media_group === 'detail'}当前商品暂无详情图片{else}当前商品暂无卖点图片{/if}</p></div>
<!--{/if}-->
</div>
